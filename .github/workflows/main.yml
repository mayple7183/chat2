name: Build Android APK 1.8.2 FIXED

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Show project files
        run: |
          pwd
          ls -la
          echo "===== gradle.properties BEFORE ====="
          cat gradle.properties || true

      - name: Force AndroidX
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          mkdir -p "$HOME/.gradle"
          echo "android.useAndroidX=true" > "$HOME/.gradle/gradle.properties"
          echo "android.enableJetifier=true" >> "$HOME/.gradle/gradle.properties"
          echo "===== PROJECT gradle.properties ====="
          cat gradle.properties
          echo "===== HOME gradle.properties ====="
          cat "$HOME/.gradle/gradle.properties"

      - name: Build APK
        run: |
          gradle \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Check APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WooriTalk-v1.8.2-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
